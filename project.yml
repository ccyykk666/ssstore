name: ssstore
options:
  bundleIdPrefix: dev.personal
  deploymentTarget:
    iOS: "17.0"
packages:
  UpdateCore:
    path: Packages/UpdateCore
  DeviceKit:
    path: Packages/DeviceKit
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "9"
targets:
  ssstore:
    type: application
    platform: iOS
    sources:
      - path: ssstore
        excludes: [Info.plist]
    info:
      path: ssstore/Info.plist
      properties:
        CFBundleDisplayName: ssstore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 用于发现配对主机，并读取本机应用和设备信息。
        NSBonjourServices: [_remotepairing-pairable-host._tcp, _remotepairing._tcp]
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).pairing.*]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.personal.ssstore
        SWIFT_OBJC_BRIDGING_HEADER: ssstore/Bridge/ssstore-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: UpdateCore
      - package: DeviceKit
        product: IDevice
schemes:
  ssstore:
    build:
      targets:
        ssstore: all

