services:
  manifest:
    build: .
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:${MANIFEST_HTTP_PORT:-8080}:8080"
    environment:
      MANIFEST_BIND_HOST: 0.0.0.0
      MANIFEST_HTTP_PORT: 8080
      MANIFEST_API_TOKEN_FILE: /run/secrets/manifest_api_token
    secrets:
      - manifest_api_token
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - manifest
    ports:
      - "80:80"
      - "443:443"
    environment:
      MANIFEST_DOMAIN: ${MANIFEST_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
secrets:
  manifest_api_token:
    file: ./secrets/manifest_api_token
