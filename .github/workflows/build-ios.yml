name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ssstore/**'
      - 'Packages/**'
      - 'project.yml'
      - 'scripts/build-ipa.sh'
      - '.github/workflows/build-ios.yml'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and iOS 27 SDK
        run: |
          xcodebuild -version
          xcode_version=$(xcodebuild -version | head -n 1)
          case "$xcode_version" in
            "Xcode 27"*) ;;
            *) echo "Expected Xcode 27" >&2; exit 1 ;;
          esac
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk_version"
          case "$sdk_version" in
            27.*) ;;
            *) echo "Expected an iOS 27 SDK" >&2; exit 1 ;;
          esac
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core and build IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ssstore-unsigned
          path: dist/*.ipa
          if-no-files-found: error

