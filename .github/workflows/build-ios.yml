name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ssstore/**'
      - 'ShareExtension/**'
      - 'Packages/**'
      - 'Vendor/**'
      - 'project.yml'
      - 'scripts/build-ipa.sh'
      - 'scripts/prepare-performance-devicekit.py'
      - 'scripts/patches/**'
      - 'scripts/*kbsync*'
      - 'scripts/select-ci-tests.py'
      - 'scripts/tests/**'
      - 'tests/native-sheet/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      native_sheet: ${{ steps.checks.outputs.native_sheet }}
      manifest_credentials: ${{ steps.checks.outputs.manifest_credentials }}
      core: ${{ steps.checks.outputs.core }}
      downloads: ${{ steps.checks.outputs.downloads }}
      localization: ${{ steps.checks.outputs.localization }}
      kbsync: ${{ steps.checks.outputs.kbsync }}
      performance: ${{ steps.checks.outputs.performance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed code
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/select-ci-tests.py
      - name: Test CI check selection
        if: steps.checks.outputs.selection == 'true'
        run: python3 -m unittest discover -s scripts/tests -v
  build:
    needs: checks
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Xcode 27 and iOS 27 SDK
        run: |
          xcodebuild -version
          xcode_version=$(xcodebuild -version | head -n 1)
          case "$xcode_version" in
            "Xcode 27"*) ;;
            *) echo "Expected Xcode 27" >&2; exit 1 ;;
          esac
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk_version"
          case "$sdk_version" in
            27.*) ;;
            *) echo "Expected an iOS 27 SDK" >&2; exit 1 ;;
          esac
      - name: Check App Swift syntax
        run: python3 scripts/check-swift-syntax.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: xcode27-store-spm-${{ hashFiles('Vendor/Asspp/Asspp.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - uses: actions/cache@v4
        id: kbsync-cache
        with:
          path: build/KBSyncCache
          key: kbsync-assets-${{ hashFiles('scripts/kbsync-manifest.json') }}
      - name: Prepare local kbsync runtime
        run: python3 scripts/prepare-kbsync.py
      - uses: actions/cache/save@v4
        if: steps.kbsync-cache.outputs.cache-hit != 'true'
        with:
          path: build/KBSyncCache
          key: kbsync-assets-${{ hashFiles('scripts/kbsync-manifest.json') }}
      - name: Test UpdateCore
        if: needs.checks.outputs.core == 'true'
        run: |
          set -o pipefail
          swift test --package-path Packages/UpdateCore 2>&1 | python3 scripts/report-build-errors.py
      - name: Check manifest credential responsiveness
        if: needs.checks.outputs.manifest_credentials == 'true'
        run: |
          swiftc -parse-as-library ssstore/ManifestAPICredentials.swift scripts/tests/ManifestCredentialChecks.swift -o "$RUNNER_TEMP/manifest-credential-checks"
          "$RUNNER_TEMP/manifest-credential-checks"
      - name: Check download protocol
        if: needs.checks.outputs.downloads == 'true'
        run: bash Vendor/Asspp/Resources/Scripts/check.downloads.sh protocol
      - name: Check store localization
        if: needs.checks.outputs.localization == 'true'
        run: bash Vendor/Asspp/Resources/Scripts/check.downloads.sh localization
      - name: Check local WebKit kbsync generation
        if: needs.checks.outputs.kbsync == 'true'
        timeout-minutes: 8
        run: bash scripts/check-kbsync.sh
      - name: Install pinned Rust toolchain for device data services
        run: |
          if ! command -v rustup >/dev/null; then
            brew install rustup
            export PATH="$(brew --prefix rustup)/bin:$PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-apple-ios
          dirname "$(command -v rustup)" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=1.94.0" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: performance-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/PerformanceCargo
            build/PerformanceDeviceKit
          key: performance-devicekit-rust194-${{ runner.arch }}-${{ hashFiles('scripts/prepare-performance-devicekit.py', 'scripts/patches/**') }}
          restore-keys: performance-devicekit-rust194-${{ runner.arch }}-
      - name: Prepare and test the patched device data dependency
        run: |
          bash scripts/prepare-devicekit.sh
          python3 scripts/prepare-performance-devicekit.py
      - uses: actions/cache/save@v4
        if: steps.performance-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/PerformanceCargo
            build/PerformanceDeviceKit
          key: ${{ steps.performance-cache.outputs.cache-primary-key }}
      - name: Check device plist conversion and legacy crash regression
        if: needs.checks.outputs.performance == 'true'
        run: bash scripts/check-device-plist.sh
      - name: Build IPA
        run: bash scripts/build-ipa.sh
      - name: Preserve release crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: ssstore-symbols
          path: |
            build/DerivedData/Build/Products/Release-iphoneos/ssstore.app.dSYM
            build/DerivedData/Build/Products/Release-iphoneos/ShareExtension.appex.dSYM
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ssstore-unsigned
          path: dist/*.ipa
          if-no-files-found: error

  native-sheet:
    needs: checks
    if: needs.checks.outputs.native_sheet == 'true'
    # UI tests need the complete Simulator application, not the SDK-only builder.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check native sheet navigation in the iOS simulator
        run: python3 tests/native-sheet/run.py
      - name: Upload native sheet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sheet-diagnostics
          path: |
            build/native-sheet-results/probe.json
            build/native-sheet-results/main-thread-sample.txt
            build/native-sheet-results/screen.png
          if-no-files-found: warn


