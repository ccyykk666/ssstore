name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ssstore/**'
      - 'Packages/**'
      - 'Vendor/**'
      - 'project.yml'
      - 'scripts/build-ipa.sh'
      - 'scripts/*kbsync*'
      - 'scripts/select-ci-tests.py'
      - 'scripts/tests/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed code
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/select-ci-tests.py
      - name: Test CI check selection
        if: steps.checks.outputs.selection == 'true'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify Xcode 27 and iOS 27 SDK
        run: |
          xcodebuild -version
          xcode_version=$(xcodebuild -version | head -n 1)
          case "$xcode_version" in
            "Xcode 27"*) ;;
            *) echo "Expected Xcode 27" >&2; exit 1 ;;
          esac
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk_version"
          case "$sdk_version" in
            27.*) ;;
            *) echo "Expected an iOS 27 SDK" >&2; exit 1 ;;
          esac
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: xcode27-store-spm-${{ hashFiles('Vendor/Asspp/Asspp.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - uses: actions/cache@v4
        id: kbsync-cache
        with:
          path: build/KBSyncCache
          key: kbsync-assets-${{ hashFiles('scripts/kbsync-manifest.json') }}
      - name: Prepare local kbsync runtime
        run: python3 scripts/prepare-kbsync.py
      - uses: actions/cache/save@v4
        if: steps.kbsync-cache.outputs.cache-hit != 'true'
        with:
          path: build/KBSyncCache
          key: kbsync-assets-${{ hashFiles('scripts/kbsync-manifest.json') }}
      - name: Test UpdateCore
        if: steps.checks.outputs.core == 'true'
        run: swift test --package-path Packages/UpdateCore
      - name: Check download protocol
        if: steps.checks.outputs.downloads == 'true'
        run: bash Vendor/Asspp/Resources/Scripts/check.downloads.sh protocol
      - name: Check store localization
        if: steps.checks.outputs.localization == 'true'
        run: bash Vendor/Asspp/Resources/Scripts/check.downloads.sh localization
      - name: Check local WebKit kbsync generation
        if: steps.checks.outputs.kbsync == 'true'
        timeout-minutes: 8
        run: bash scripts/check-kbsync.sh
      - name: Build IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ssstore-unsigned
          path: dist/*.ipa
          if-no-files-found: error


