name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ssstore/**'
      - 'Packages/**'
      - 'project.yml'
      - 'scripts/build-ipa.sh'
      - '.github/workflows/build-ios.yml'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26 and iOS 26 SDK
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk_version"
          case "$sdk_version" in
            26.*) ;;
            *) echo "Expected an iOS 26 SDK" >&2; exit 1 ;;
          esac
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core and build IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ssstore-unsigned
          path: dist/*.ipa
          if-no-files-found: error
